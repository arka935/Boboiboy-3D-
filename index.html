<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BoBoiBoy 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menuScreen">
        <h1>BOBOIBOY 3D</h1>
        <button id="btnStart">Mulai Game</button>
        <button id="btnExit">Keluar</button>
    </div>
    <div id="gameContainer" style="display:none">
        <canvas id="gameCanvas"></canvas>
        <div id="gameUI">
            <div>Mode: <span id="modeText">BoBoiBoy</span></div>
            <div>
                <button id="attackBtn">Serang</button>
                <button id="jumpBtn">Loncat</button>
                <button id="skillBtn">Skill</button>
                <button id="resetBtn">Reset</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
                                     </html>
